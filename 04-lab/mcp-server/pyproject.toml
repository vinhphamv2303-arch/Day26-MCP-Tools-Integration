[project]
name = "my-weather-mcp-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.12.4,<4.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
    "mcp[cli]>=1.16.0,<2.0.0",
    "uvicorn>=0.27.0",
    "starlette>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
