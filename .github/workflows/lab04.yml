name: Lab 04

on:
  push:
    paths:
      - "04-lab/**"
      - ".github/workflows/lab04.yml"
  pull_request:
    paths:
      - "04-lab/**"
      - ".github/workflows/lab04.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-lab/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --dev
      - run: uv run pytest -q
